<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi Amor</title>
<meta name="description" content="Una cartita para ti">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#12090d;color:#fff}
body{overflow-x:hidden}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,80,120,.20),transparent 30%),radial-gradient(circle at 80% 70%,rgba(255,30,90,.13),transparent 32%),linear-gradient(145deg,#17090e,#080507);z-index:-2}
.glow{position:fixed;width:280px;height:280px;border-radius:50%;background:rgba(255,55,100,.10);filter:blur(50px);animation:float 7s ease-in-out infinite;z-index:-1}
.glow.one{top:-100px;left:-80px}.glow.two{bottom:-120px;right:-80px;animation-delay:2s}
@keyframes float{50%{transform:translate(35px,25px) scale(1.12)}}
.card{width:min(430px,100%);min-height:min(690px,90vh);border:1px solid rgba(255,255,255,.14);border-radius:30px;background:rgba(255,255,255,.055);backdrop-filter:blur(16px);box-shadow:0 25px 80px rgba(0,0,0,.5);padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
@media (max-width:380px){.card{padding:16px}h1{font-size:34px}.photo-wrap{height:300px}}
.small{letter-spacing:4px;text-transform:uppercase;font-size:11px;color:#f7a7ba;margin-top:8px}
h1{font-size:42px;margin:8px 0 18px;font-weight:normal}
.photo-wrap{width:100%;height:380px;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 15px 45px rgba(0,0,0,.4)}
.photo{width:100%;height:100%;object-fit:cover;object-position:center 22%;filter:saturate(.92) contrast(.96)}
.photo-wrap:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,rgba(10,4,7,.55))}
button{margin-top:24px;border:0;border-radius:999px;padding:14px 26px;background:#f25b82;color:white;font-size:15px;cursor:pointer;box-shadow:0 8px 30px rgba(242,91,130,.25);transition:.25s}
button:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(242,91,130,.4)}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.hidden{display:none!important}
.letter{width:100%;text-align:left;margin-top:10px;line-height:1.75;font-size:17px;color:#f9e9ed;animation:appear .8s ease}
.letter h2{text-align:center;font-size:30px;font-weight:normal;margin:8px 0 20px;color:#fff}
.letter p{margin:0 0 16px}
.signature{text-align:right;font-style:italic;color:#f7a7ba;margin-top:24px}
.cursor{display:inline-block;width:2px;height:1em;background:#f7a7ba;margin-left:3px;vertical-align:-2px;animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
.final{font-size:21px;text-align:center;margin-top:28px;color:#fff}
.final span{color:#ff7898}
.heart{position:fixed;bottom:-30px;font-size:18px;opacity:.8;animation:rise linear forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.note{font-size:12px;color:rgba(255,255,255,.55);margin-top:12px}
@media (prefers-reduced-motion:reduce){*,.glow,.heart,.letter,.cursor{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div><div class="glow one"></div><div class="glow two"></div>
<main class="screen">
<section class="card">
<div class="small">Para alguien especial</div>

<button id="openBtn">Tengo algo que decirte</button>
<div class="letter hidden" id="letter">
<h2>Amor,</h2>
<p id="p1"></p><p id="p2"></p><p id="p3"></p>
<p class="signature">Con todo mi cariño,<br>tu esposo Jonathan R.</p>
<div class="final">Me gustas más de lo que quizás imaginas... <span>♥</span></div>
</div>
<div class="note" id="note">Lee esto con calma...</div>
<audio id="bgMusic" src="musica.mp3" preload="auto"></audio>
</section>
</main>
<script>
const texts=[
`Sé que no llevamos mucho tiempo, pero en este poquito tiempo te has ido ganando un espacio muy bonito en mi mente y en mi corazón. Me encanta pensar en ti, hablar contigo y descubrir cada día un poquito más de ti.`,
`Y aunque todavía estamos empezando a escribir nuestra historia, quiero que sepas que me hace mucha ilusión seguir conociéndote, compartir momentos contigo y ver hasta dónde nos puede llevar esto tan bonito que estamos comenzando.`,
` 

¿Sabes qué? me gustas. Y no pasa nada si no sientes lo mismo. Simplemente me pareces una persona increíble. Y como no sé qué pasará mañana, prefiero decírtelo hoy.`
];
const btn=document.getElementById('openBtn'),letter=document.getElementById('letter'),note=document.getElementById('note');
const bgMusic=document.getElementById('bgMusic');
bgMusic.volume=0.25;
function typeText(el,text,speed=24){
 return new Promise(resolve=>{
  let i=0;const cursor=document.createElement('span');cursor.className='cursor';el.appendChild(cursor);
  const timer=setInterval(()=>{
   cursor.before(document.createTextNode(text[i]));i++;
   if(i>=text.length){clearInterval(timer);cursor.remove();resolve();}
  },speed);
 });
}
function heart(){
 const h=document.createElement('div');h.className='heart';h.textContent=['♥','♡','❤'][Math.floor(Math.random()*3)];
 h.style.left=Math.random()*100+'vw';h.style.animationDuration=(5+Math.random()*5)+'s';
 h.style.fontSize=(12+Math.random()*18)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),10000);
}
btn.addEventListener('click',async()=>{
 bgMusic.play();
 btn.classList.add('hidden');note.classList.add('hidden');letter.classList.remove('hidden');
 for(let i=0;i<texts.length;i++)await typeText(document.getElementById('p'+(i+1)),texts[i]);
 bgMusic.pause();
 bgMusic.currentTime=0;
 const fade=setInterval(()=>{if(bgMusic.volume>0.03){bgMusic.volume=Math.max(0,bgMusic.volume-0.03);}else{clearInterval(fade);bgMusic.pause();bgMusic.currentTime=0;bgMusic.volume=0.25;}},100);
 for(let i=0;i<18;i++)setTimeout(heart,i*180);
});
</script>
